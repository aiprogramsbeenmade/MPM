[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mpm-format"
version = "0.2.0"
description = "MPM — Minimal Portable Mapping: un formato tabellare aperto, tipizzato e comprimibile"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "LICENSE-SPEC"]
authors = [{ name = "Matteo Proietti Micozzi" }]
dependencies = [
    "zstandard>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mpm = "mpm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]